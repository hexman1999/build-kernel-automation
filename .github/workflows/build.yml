name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      # ── Variants ─────────────────────────────────────────────────────────────
      build_kernelsu_next:
        description: "Build with KernelSU Next (inline hook)"
        required: false
        default: true
        type: boolean

      build_kowsu:
        description: "Build with KowSU (inline hook)"
        required: false
        default: false
        type: boolean

      build_vanilla:
        description: "Build Vanilla (no root manager)"
        required: false
        default: false
        type: boolean

      # ── Feature Toggles ───────────────────────────────────────────────────────
      susfs_enabled:
        description: "Enable SUSFS"
        required: false
        default: true
        type: boolean

      avc_spoof:
        description: "Enable AVC Log Spoofing"
        required: false
        default: true
        type: boolean

      hide_selinux:
        description: "Hide SELinux Modifications"
        required: false
        default: true
        type: boolean

      release:
        description: "Create GitHub Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  DEVICE: sweet
  DEVICE_DEFCONFIG: sweet_defconfig
  ARCH: arm64
  KERNEL_DIR: kernel
  CLANG_VERSION: r530567
  KERNELSU_NEXT_REPO: https://github.com/KernelSU-Next/KernelSU-Next
  KOWSU_REPO: https://github.com/KOWX712/KernelSU

# ═══════════════════════════════════════════════════════════════════════════════
jobs:

  # ── Job 1: Preparation ───────────────────────────────────────────────────────
  setup:
    name: Preparation
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Require At Least One Variant
        run: |
          if [ "${{ github.event.inputs.build_kernelsu_next }}" != "true" ] && \
             [ "${{ github.event.inputs.build_kowsu }}"         != "true" ] && \
             [ "${{ github.event.inputs.build_vanilla }}"       != "true" ]; then
            echo "❌ ERROR: Select at least one build variant!"
            exit 1
          fi
          echo "✅ Validation passed"

      - name: Build Matrix JSON
        id: matrix
        run: |
          VARIANTS=()
          [ "${{ github.event.inputs.build_kernelsu_next }}" = "true" ] && VARIANTS+=("kernelsu_next")
          [ "${{ github.event.inputs.build_kowsu }}"         = "true" ] && VARIANTS+=("kowsu")
          [ "${{ github.event.inputs.build_vanilla }}"       = "true" ] && VARIANTS+=("vanilla")

          JSON="["
          for i in "${!VARIANTS[@]}"; do
            [ $i -gt 0 ] && JSON+=","
            JSON+="\"${VARIANTS[$i]}\""
          done
          JSON+="]"

          echo "Matrix: $JSON"
          echo "value=$JSON" >> $GITHUB_OUTPUT

      - name: Cache Raw Kernel Source
        id: cache-kernel-raw
        uses: actions/cache@v4
        with:
          path: ${{ env.KERNEL_DIR }}
          key: kernel-raw-sm6150-sixteen-qpr2

      - name: Download Kernel Source
        if: steps.cache-kernel-raw.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 \
            https://github.com/PixelOS-Devices/android_kernel_xiaomi_sm6150 \
            ${{ env.KERNEL_DIR }} -b sixteen-qpr2

      - name: Apply Common LN8000 Patches
        run: |
          cd ${{ env.KERNEL_DIR }}
          PATCHES=(
            "https://github.com/crdroidandroid/android_kernel_xiaomi_sm6150/commit/7b73f853977d2c016e30319dffb1f49957d30b40.patch"
            "https://github.com/crdroidandroid/android_kernel_xiaomi_sm6150/commit/63dddc108d57dc43e1cd0da0f1445875f760cf97.patch"
          )
          for patch in "${PATCHES[@]}"; do
            echo "  → Applying: $patch"
            if curl -sf "$patch" | patch -p1 --dry-run > /dev/null 2>&1; then
              curl -sf "$patch" | patch -p1 --fuzz=2 || echo "  ⚠ patch failed to apply"
            else
              echo "  ⚠ skipped (does not apply cleanly)"
            fi
          done

      - name: Enable CONFIG_KPROBES in Base Defconfig
        run: |
          cd ${{ env.KERNEL_DIR }}
          DEFCONFIG="arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}"
          if grep -q "# CONFIG_KPROBES is not set" "$DEFCONFIG"; then
            sed -i 's/# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/' "$DEFCONFIG"
            echo "  ✓ CONFIG_KPROBES enabled (was disabled)"
          elif ! grep -q "^CONFIG_KPROBES=y" "$DEFCONFIG"; then
            echo "CONFIG_KPROBES=y" >> "$DEFCONFIG"
            echo "  ✓ CONFIG_KPROBES added"
          else
            echo "  ✓ CONFIG_KPROBES already set"
          fi

      - name: Cache AOSP Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: toolchain/clang
          # OS included in key — prevents stale glibc mismatch if runner image changes
          key: aosp-clang-${{ env.CLANG_VERSION }}-ubuntu22

      - name: Download AOSP Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain/clang
          wget -q \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-${{ env.CLANG_VERSION }}.tar.gz" \
            -O toolchain/clang.tar.gz
          tar -xzf toolchain/clang.tar.gz -C toolchain/clang
          rm toolchain/clang.tar.gz
          echo "  ✓ Clang ${{ env.CLANG_VERSION }} extracted"

      - name: Save Patched Kernel Source for Matrix Jobs
        uses: actions/cache/save@v4
        with:
          path: ${{ env.KERNEL_DIR }}
          key: kernel-patched-${{ github.run_id }}

  # ── Job 2: Matrix Build ──────────────────────────────────────────────────────
  build:
    name: "[${{ matrix.variant }}] sweet"
    needs: setup
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        variant: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Patched Kernel Source
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.KERNEL_DIR }}
          key: kernel-patched-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Restore AOSP Clang Toolchain
        uses: actions/cache/restore@v4
        with:
          path: toolchain/clang
          key: aosp-clang-${{ env.CLANG_VERSION }}-ubuntu22
          fail-on-cache-miss: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential bc bison ca-certificates curl flex \
            fontconfig-config fonts-dejavu-core gcc \
            gcc-aarch64-linux-gnu git gnupg gzip libelf-dev \
            lib32z1-dev libtinfo5 openssl pahole python3 repo \
            rsync schedtool wget zip zlib1g-dev

      - name: Verify Clang Installation
        run: |
          echo "Clang: $(toolchain/clang/bin/clang --version | head -1)"

      # ── KSU Driver Integration (shared logic for kernelsu_next and kowsu) ────
      - name: Integrate KSU Driver
        if: matrix.variant != 'vanilla'
        run: |
          cd ${{ env.KERNEL_DIR }}
          DEFCONFIG="arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}"

          # Select repo and label based on variant
          case "${{ matrix.variant }}" in
            kernelsu_next)
              REPO="${{ env.KERNELSU_NEXT_REPO }}"
              LABEL="KernelSU Next"
              KSU_COMMENT="# KernelSU Next — inline hook"
              ;;
            kowsu)
              REPO="${{ env.KOWSU_REPO }}"
              LABEL="KowSU"
              KSU_COMMENT="# KowSU — inline hook"
              ;;
          esac

          echo "── ${LABEL}: integration ──"

          # Clone and copy driver files
          git clone --depth=1 "$REPO" ../ksu_src
          cp -r ../ksu_src/kernel drivers/kernelsu
          echo "  ✓ Driver files → drivers/kernelsu"

          # Wire into the build system
          grep -q "kernelsu" drivers/Makefile || \
            printf '\n# %s\nobj-y += kernelsu/\n' "${LABEL}" >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || \
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          echo "  ✓ Makefile and Kconfig updated"

          # ── Collect all uapi headers from source ────────────────────────────
          # Build a definitive uapi directory from all possible source locations
          mkdir -p /tmp/ksu_uapi_collected

          # 1. Copy from kernel/uapi if it exists
          if [ -d "../ksu_src/kernel/uapi" ]; then
            cp -r ../ksu_src/kernel/uapi/. /tmp/ksu_uapi_collected/
            echo "  ✓ uapi headers collected from kernel/uapi"
          fi

          # 2. Hunt for any .h files under any uapi dir in the source tree
          find ../ksu_src -path "*/uapi/*.h" 2>/dev/null | while read f; do
            cp "$f" /tmp/ksu_uapi_collected/ 2>/dev/null || true
          done

          # 3. Ensure app_profile.h exists — stub if still missing
          if [ ! -f "/tmp/ksu_uapi_collected/app_profile.h" ]; then
            FOUND=$(find ../ksu_src -name "app_profile.h" 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              cp "$FOUND" /tmp/ksu_uapi_collected/
              echo "  ✓ app_profile.h found at: $FOUND"
            else
              cat > /tmp/ksu_uapi_collected/app_profile.h << 'HEADER_EOF'
          #ifndef __KSU_UAPI_APP_PROFILE_H
          #define __KSU_UAPI_APP_PROFILE_H
          #include <linux/types.h>
          #define KSU_MAX_PACKAGE_NAME 256
          struct app_profile {
              char name[KSU_MAX_PACKAGE_NAME];
              __u32 uid;
              __u32 flags;
          };
          #endif /* __KSU_UAPI_APP_PROFILE_H */
          HEADER_EOF
              echo "  ⚠ app_profile.h not found upstream — stub created"
            fi
          fi
          sed -i '1i #include <linux/syscalls.h>' drivers/kernelsu/hook/syscall_hook.h
          sed -i '2i typedef void (*syscall_fn_t)(void);' drivers/kernelsu/hook/syscall_hook.h
          # 4. Ensure feature.h exists — stub if missing
          if [ ! -f "/tmp/ksu_uapi_collected/feature.h" ]; then
            FOUND=$(find ../ksu_src -name "feature.h" 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              cp "$FOUND" /tmp/ksu_uapi_collected/
              echo "  ✓ feature.h found at: $FOUND"
            else
              cat > /tmp/ksu_uapi_collected/feature.h << 'HEADER_EOF'
          #ifndef __KSU_UAPI_FEATURE_H
          #define __KSU_UAPI_FEATURE_H
          #include <linux/types.h>
          #define KSU_FEATURE_DEFAULT 0
          #endif /* __KSU_UAPI_FEATURE_H */
          HEADER_EOF
              echo "  ⚠ feature.h not found upstream — stub created"
            fi
          fi

          echo "  uapi headers collected:"
          ls /tmp/ksu_uapi_collected/

          # ── Deploy uapi headers to every location that needs them ────────────
          # Use real copies everywhere — no symlinks — avoids relative-path
          # resolution issues when the compiler walks include paths

          # drivers/kernelsu/uapi  (top-level includes)
          rm -rf drivers/kernelsu/uapi
          cp -r /tmp/ksu_uapi_collected drivers/kernelsu/uapi
          echo "  ✓ drivers/kernelsu/uapi populated"

          # drivers/kernelsu/policy/uapi  (policy/feature.h does: #include "uapi/feature.h")
          if [ -d "drivers/kernelsu/policy" ]; then
            rm -rf drivers/kernelsu/policy/uapi
            cp -r /tmp/ksu_uapi_collected drivers/kernelsu/policy/uapi
            echo "  ✓ drivers/kernelsu/policy/uapi populated"
          else
            echo "  ℹ No policy dir — skipping policy/uapi"
          fi

          # drivers/kernelsu/core/uapi  (guard against core/ doing the same include)
          if [ -d "drivers/kernelsu/core" ]; then
            rm -rf drivers/kernelsu/core/uapi
            cp -r /tmp/ksu_uapi_collected drivers/kernelsu/core/uapi
            echo "  ✓ drivers/kernelsu/core/uapi populated"
          fi

          rm -rf /tmp/ksu_uapi_collected

          # ── Pin GIT version ──────────────────────────────────────────────────
          # KernelSU-Next's Kbuild detects version via `git describe` and warns
          # when it can't (shallow clone, no tags). Tag the clone so detection
          # succeeds cleanly instead of falling back to version 1 / v0.0.1.
          (
            cd ../ksu_src
            git config user.email "ci@build" 2>/dev/null || true
            git config user.name  "CI"        2>/dev/null || true
            git tag v1.0.0 2>/dev/null || true
          )
          echo "  ✓ KSU git tag set to v1.0.0 for version detection"

          # ── Defconfig: enable inline hook, disable kprobes hook ──────────────
          printf '\n%s\nCONFIG_KSU=y\nCONFIG_KSU_INLINE_HOOK=y\n' \
            "${KSU_COMMENT}" >> "$DEFCONFIG"

          if grep -q "CONFIG_KSU_KPROBES_HOOK" drivers/kernelsu/Kconfig 2>/dev/null; then
            echo 'CONFIG_KSU_KPROBES_HOOK=n' >> "$DEFCONFIG"
            echo "  ✓ kprobes hook explicitly disabled"
          fi

          echo "  ✓ ${LABEL} integration complete"

      - name: Verify KSU uAPI Structure
        if: matrix.variant != 'vanilla'
        run: |
          cd ${{ env.KERNEL_DIR }}
          echo "Verifying KSU uapi structure for ${{ matrix.variant }}..."
          PASS=true

          [ -d "drivers/kernelsu/uapi" ] \
            && echo "  ✓ drivers/kernelsu/uapi exists" \
            || { echo "  ✗ drivers/kernelsu/uapi missing"; PASS=false; }

          [ -f "drivers/kernelsu/uapi/app_profile.h" ] \
            && echo "  ✓ app_profile.h present in kernelsu/uapi" \
            || { echo "  ✗ app_profile.h missing from kernelsu/uapi"; PASS=false; }

          [ -f "drivers/kernelsu/uapi/feature.h" ] \
            && echo "  ✓ feature.h present in kernelsu/uapi" \
            || { echo "  ✗ feature.h missing from kernelsu/uapi"; PASS=false; }

          if [ -d "drivers/kernelsu/policy" ]; then
            [ -f "drivers/kernelsu/policy/uapi/feature.h" ] \
              && echo "  ✓ policy/uapi/feature.h present" \
              || { echo "  ✗ policy/uapi/feature.h missing — this will cause build failure"; PASS=false; }
          else
            echo "  ℹ No policy dir — policy/uapi check skipped"
          fi

          grep -q "CONFIG_KSU=y" "arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}" \
            && echo "  ✓ CONFIG_KSU=y in defconfig" \
            || { echo "  ✗ CONFIG_KSU missing from defconfig"; PASS=false; }

          grep -q "CONFIG_KSU_INLINE_HOOK=y" "arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}" \
            && echo "  ✓ CONFIG_KSU_INLINE_HOOK=y in defconfig" \
            || { echo "  ✗ CONFIG_KSU_INLINE_HOOK missing from defconfig"; PASS=false; }

          if [ "$PASS" != "true" ]; then
            echo "❌ uAPI verification failed"
            exit 1
          fi
          echo "✅ uAPI verification passed"

      # ── SUSFS ────────────────────────────────────────────────────────────────
      - name: Apply SUSFS Patches
        if: ${{ github.event.inputs.susfs_enabled == 'true' && matrix.variant != 'vanilla' }}
        run: |
          cd ${{ env.KERNEL_DIR }}

          # Canonical SUSFS repo — pinned to the KSU-Next compatible kernel patch
          SUSFS_KERNEL_PATCH="https://raw.githubusercontent.com/simonpunk/susfs4ksu/main/kernel_patches/add_susfs_in_kernel-1.5.5.patch"
          SUSFS_KSU_PATCH="https://raw.githubusercontent.com/simonpunk/susfs4ksu/main/kernel_patches/fs_sus_sus_path.patch"

          apply_patch() {
            local url="$1"
            local name="$2"
            echo "  → Applying ${name}..."
            if curl -Lsf "$url" | patch -p1 --dry-run > /dev/null 2>&1; then
              curl -Lsf "$url" | patch -s -p1 --fuzz=5 \
                && echo "  ✓ ${name} applied" \
                || echo "  ⚠ ${name} failed during apply"
            else
              echo "  ⚠ ${name} does not apply cleanly — skipping"
            fi
          }

          apply_patch "$SUSFS_KERNEL_PATCH" "SUSFS kernel patch"
          apply_patch "$SUSFS_KSU_PATCH"    "SUSFS KSU hook patch"

      # ── Security Feature Config ──────────────────────────────────────────────
      - name: Configure AVC Spoofing and SELinux Hiding
        if: ${{ github.event.inputs.avc_spoof == 'true' || github.event.inputs.hide_selinux == 'true' }}
        run: |
          cd ${{ env.KERNEL_DIR }}
          DEFCONFIG="arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}"

          if [ "${{ github.event.inputs.avc_spoof }}" = "true" ]; then
            printf '\n# AVC Log Spoofing\nCONFIG_AUDIT=y\nCONFIG_AUDIT_ARCH=y\nCONFIG_AUDITSYSCALL=y\nCONFIG_AUDIT_GENERIC=y\n' \
              >> "$DEFCONFIG"
            echo "  ✓ AVC spoofing configs appended"
          fi

          if [ "${{ github.event.inputs.hide_selinux }}" = "true" ]; then
            printf '\n# SELinux Hiding\nCONFIG_SECURITY_SELINUX=y\nCONFIG_SECURITY_SELINUX_BOOTPARAM=y\nCONFIG_SECURITY_SELINUX_DEVELOP=y\nCONFIG_SECURITY_SELINUX_DEBUG=y\nCONFIG_SECURITY_SELINUX_AVC_STATS=y\n' \
              >> "$DEFCONFIG"
            echo "  ✓ SELinux hiding configs appended"
          fi

      - name: Deduplicate Defconfig
        run: |
          cd ${{ env.KERNEL_DIR }}
          DEFCONFIG="arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}"
          awk '!seen[$0]++' "$DEFCONFIG" > "${DEFCONFIG}.tmp"
          mv "${DEFCONFIG}.tmp" "$DEFCONFIG"
          echo "Defconfig tail (last 25 lines):"
          tail -25 "$DEFCONFIG"

      # ── Compile ──────────────────────────────────────────────────────────────
      - name: Build Kernel
        run: |
          cd ${{ env.KERNEL_DIR }}
          export PATH=${{ github.workspace }}/toolchain/clang/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang CXX=clang++ LD=ld.lld
          export AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

          make O=out ARCH=${{ env.ARCH }} ${{ env.DEVICE_DEFCONFIG }}

          make -j$(nproc) O=out ARCH=${{ env.ARCH }} \
            LLVM=1 LTO=thin \
            LOCALVERSION="-${{ matrix.variant }}-${{ env.DEVICE }}" \
            Image.gz dtbs

          echo "── Build complete ──"
          ls -lh out/arch/arm64/boot/

      - name: Verify Kernel Build Output
        run: |
          cd ${{ env.KERNEL_DIR }}
          PASS=true

          if [ ! -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "❌ Image.gz not found — build likely failed"
            echo "Boot dir contents:"
            ls out/arch/arm64/boot/ || true
            PASS=false
          else
            echo "  ✓ Image.gz present ($(du -h out/arch/arm64/boot/Image.gz | cut -f1))"
          fi

          DTB_COUNT=$(find out/arch/arm64/boot/dts -name "*.dtb" 2>/dev/null | wc -l)
          if [ "$DTB_COUNT" -eq 0 ]; then
            echo "❌ No DTB files found"
            PASS=false
          else
            echo "  ✓ ${DTB_COUNT} DTB file(s) found"
          fi

          [ "$PASS" != "true" ] && exit 1
          echo "✅ Build output verified"

      # ── Timestamps ───────────────────────────────────────────────────────────
      - name: Set Build Timestamps
        id: ts
        run: |
          echo "date=$(date +%Y%m%d)"                     >> $GITHUB_OUTPUT
          echo "time=$(date +%H%M)"                       >> $GITHUB_OUTPUT
          echo "pretty=$(date -u +'%Y-%m-%d %H:%M UTC')"  >> $GITHUB_OUTPUT

      # ── Package ──────────────────────────────────────────────────────────────
      - name: Prepare Flashable ZIP
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AK3

          # ── Copy kernel artifacts ───────────────────────────────────────────
          cp ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz AK3/zImage
          echo "  ✓ Image.gz → AK3/zImage"

          find ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/dts \
            -name "*.dtb" -exec cat {} + > AK3/dtb
          echo "  ✓ DTBs concatenated → AK3/dtb"

          # ── Configure anykernel.sh ──────────────────────────────────────────
          sed -i 's/device.name1=.*/device.name1=sweet/'   AK3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=sweetin/' AK3/anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=0/'   AK3/anykernel.sh

          # Set boot partition explicitly:
          #   Remove any existing block= line, then insert after do.devicecheck=
          #   which is always present — avoids position ambiguity
          sed -i '/^block=/d' AK3/anykernel.sh
          sed -i '/^do.devicecheck=/a block=/dev/block/by-name/boot;' AK3/anykernel.sh
          echo "  ✓ block=/dev/block/by-name/boot; set"

          # Map variant → friendly display name
          case "${{ matrix.variant }}" in
            kernelsu_next) F_NAME="KernelSU Next" ;;
            kowsu)         F_NAME="KowSU"         ;;
            vanilla)       F_NAME="No KSU"        ;;
            *)             F_NAME="${{ matrix.variant }}" ;;
          esac
          sed -i "s|kernel.string=.*|kernel.string=Vantom Kernel - ${F_NAME} - ${{ steps.ts.outputs.date }}|" \
            AK3/anykernel.sh
          echo "  ✓ anykernel.sh configured"

          # ── Build filename ──────────────────────────────────────────────────
          case "${{ matrix.variant }}" in
            kernelsu_next) V_FILE="ksunext" ;;
            *)             V_FILE="${{ matrix.variant }}" ;;
          esac

          if [ "${{ github.event.inputs.susfs_enabled }}" = "true" ] && \
             [ "${{ matrix.variant }}" != "vanilla" ]; then
            S_TAG="-susfs"
          else
            S_TAG=""
          fi

          ZIPNAME="${V_FILE}${S_TAG}-VantomKernel-sweet-${{ steps.ts.outputs.date }}-${{ steps.ts.outputs.time }}"
          echo "ZIP_NAME=${ZIPNAME}" >> $GITHUB_ENV
          echo "  ✓ ZIP name: ${ZIPNAME}"

          # ── Write metadata files into AK3 ───────────────────────────────────
          cat > AK3/metadata.txt << EOF
          VARIANT=${{ matrix.variant }}
          SUSFS=${{ github.event.inputs.susfs_enabled }}
          AVC_SPOOF=${{ github.event.inputs.avc_spoof }}
          HIDE_SELINUX=${{ github.event.inputs.hide_selinux }}
          DEVICE=sweet
          BUILD_DATE=${{ steps.ts.outputs.pretty }}
          EOF

          cat > AK3/BUILD_INFO.txt << EOF
          ╔════════════════════════════════════════════════════════════╗
          ║              Vantom Kernel — Build Information             ║
          ╚════════════════════════════════════════════════════════════╝

          Build Details
          ─────────────────────────────────────────────────────────────
          Date & Time :   ${{ steps.ts.outputs.pretty }}
          Variant     :   ${{ matrix.variant }}
          Device      :   sweet (Redmi Note 10 Pro)

          Features
          ─────────────────────────────────────────────────────────────
          Root Manager :  ${{ matrix.variant }}
          SUSFS        :  ${{ github.event.inputs.susfs_enabled }}
          AVC Spoofing :  ${{ github.event.inputs.avc_spoof }}
          SELinux Hide :  ${{ github.event.inputs.hide_selinux }}

          Build Configuration
          ─────────────────────────────────────────────────────────────
          Kernel       :  4.14.x (arm64)
          Compiler     :  AOSP Clang ${{ env.CLANG_VERSION }}
          Optimisation :  LTO thin · LLVM
          Architecture :  ARM64
          Defconfig    :  ${{ env.DEVICE_DEFCONFIG }}

          Build Info
          ─────────────────────────────────────────────────────────────
          Build ID     :  ${{ github.run_id }}
          Run Number   :  ${{ github.run_number }}
          Repository   :  ${{ github.repository }}

          Installation
          ─────────────────────────────────────────────────────────────
          1. Boot into recovery (TWRP)
          2. Install → select this ZIP
          3. Reboot and enjoy!
          ═════════════════════════════════════════════════════════════
          EOF

          # ── Create ZIP from inside AK3 — prevents nested-zip issue ──────────
          cd AK3
          zip -r9 ../${ZIPNAME}.zip . \
            --exclude ".git/*" \
            --exclude ".gitignore" \
            --exclude "*.md" \
            --exclude "LICENSE"
          cd ..

          echo "  ✓ Flashable ZIP created"
          ls -lh ${ZIPNAME}.zip

      # ── Release Notes ────────────────────────────────────────────────────────
      - name: Generate Release Notes
        run: |
          cat > /tmp/release_body.md << EOF
          # Vantom Kernel [${{ matrix.variant }}] — sweet (Redmi Note 10 Pro)

          | Property | Value |
          |----------|-------|
          | Variant | \`${{ matrix.variant }}\` |
          | Hook Method | Inline (no kprobes) |
          | SUSFS | ${{ github.event.inputs.susfs_enabled == 'true' && '✅' || '❌' }} |
          | AVC Log Spoofing | ${{ github.event.inputs.avc_spoof == 'true' && '✅' || '❌' }} |
          | SELinux Hiding | ${{ github.event.inputs.hide_selinux == 'true' && '✅' || '❌' }} |

          **Build:** 4.14.x · arm64 · AOSP Clang ${{ env.CLANG_VERSION }} · LTO thin · LLVM
          **Date:** ${{ steps.ts.outputs.pretty }}
          EOF

      # ── Upload ───────────────────────────────────────────────────────────────
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ github.event.inputs.release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}.zip
          tag_name: ${{ env.ZIP_NAME }}
          body_path: /tmp/release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Summary ──────────────────────────────────────────────────────────────
      - name: Build Summary
        if: always()
        run: |
          echo "## 🔨 [${{ matrix.variant }}] Build Summary"          >> $GITHUB_STEP_SUMMARY
          echo ""                                                       >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |"                                       >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|"                                       >> $GITHUB_STEP_SUMMARY
          echo "| Device | \`${{ env.DEVICE }}\` |"                   >> $GITHUB_STEP_SUMMARY
          echo "| Variant | \`${{ matrix.variant }}\` |"              >> $GITHUB_STEP_SUMMARY
          echo "| SUSFS | ${{ github.event.inputs.susfs_enabled }} |"  >> $GITHUB_STEP_SUMMARY
          echo "| AVC Spoofing | ${{ github.event.inputs.avc_spoof }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SELinux Hiding | ${{ github.event.inputs.hide_selinux }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Compiler | AOSP Clang ${{ env.CLANG_VERSION }} |"   >> $GITHUB_STEP_SUMMARY
          echo "| ZIP | \`${{ env.ZIP_NAME }}.zip\` |"                >> $GITHUB_STEP_SUMMARY