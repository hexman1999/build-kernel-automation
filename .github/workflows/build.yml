name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      # ── Variants (select one or more — at least one required) ─────────────────
      build_kernelsu_next:
        description: "✅ Build with KernelSU Next (inline hook)"
        required: false
        default: true
        type: boolean

      build_kowsu:
        description: "✅ Build with KowSU (inline hook)"
        required: false
        default: false
        type: boolean

      build_vanilla:
        description: "✅ Build Vanilla (no root manager)"
        required: false
        default: false
        type: boolean

      # ── Feature Toggles ──────────────────────────────────────────────────────
      susfs_enabled:
        description: "Enable SUSFS"
        required: false
        default: true
        type: boolean

      avc_spoof:
        description: "Enable AVC Log Spoofing"
        required: false
        default: true
        type: boolean

      hide_selinux:
        description: "Hide SELinux Modifications"
        required: false
        default: true
        type: boolean

      release:
        description: "Create GitHub Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  DEVICE: sweet
  DEVICE_DEFCONFIG: sweet_defconfig
  ARCH: arm64
  KERNEL_DIR: kernel
  CLANG_VERSION: r530567
  KERNELSU_NEXT_REPO: https://github.com/KernelSU-Next/KernelSU-Next
  KOWSU_REPO: https://github.com/KOWX712/KernelSU

# ═══════════════════════════════════════════════════════════════════════════════
jobs:

  # ── Job 1: Preparation (Clone, Patch Common, Clang, Prepare Matrix) ─────────
  setup:
    name: Preparation
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Require At Least One Variant
        run: |
          if [ "${{ github.event.inputs.build_kernelsu_next }}" != "true" ] && \
             [ "${{ github.event.inputs.build_kowsu }}"         != "true" ] && \
             [ "${{ github.event.inputs.build_vanilla }}"       != "true" ]; then
            echo "❌ ERROR: Select at least one build variant!"
            exit 1
          fi
          echo "✅ Validation passed"

      - name: Build Matrix JSON
        id: matrix
        run: |
          VARIANTS=()
          [ "${{ github.event.inputs.build_kernelsu_next }}" = "true" ] && VARIANTS+=("kernelsu_next")
          [ "${{ github.event.inputs.build_kowsu }}"         = "true" ] && VARIANTS+=("kowsu")
          [ "${{ github.event.inputs.build_vanilla }}"       = "true" ] && VARIANTS+=("vanilla")

          JSON="["
          for i in "${!VARIANTS[@]}"; do
            [ $i -gt 0 ] && JSON+=","
            JSON+="\"${VARIANTS[$i]}\""
          done
          JSON+="]"

          echo "Matrix: $JSON"
          echo "value=$JSON" >> $GITHUB_OUTPUT

      - name: Cache Raw Kernel Source
        id: cache-kernel-raw
        uses: actions/cache@v4
        with:
          path: ${{ env.KERNEL_DIR }}
          key: kernel-raw-sm6150-sixteen-qpr2

      - name: Download Kernel Source
        if: steps.cache-kernel-raw.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 \
            https://github.com/PixelOS-Devices/android_kernel_xiaomi_sm6150 \
            ${{ env.KERNEL_DIR }} -b sixteen-qpr2

      - name: Apply Common LN8000 Patches
        run: |
          cd ${{ env.KERNEL_DIR }}
          PATCHES=(
            "https://github.com/crdroidandroid/android_kernel_xiaomi_sm6150/commit/7b73f853977d2c016e30319dffb1f49957d30b40.patch"
            "https://github.com/crdroidandroid/android_kernel_xiaomi_sm6150/commit/63dddc108d57dc43e1cd0da0f1445875f760cf97.patch"
          )
          for patch in "${PATCHES[@]}"; do
            echo "  → $patch"
            if curl -sf "$patch" | patch -p1 --dry-run > /dev/null 2>&1; then
              curl -sf "$patch" | patch -p1 --fuzz=2 || echo "  ⚠ already applied"
            else
              echo "  ⚠ skipped (does not apply)"
            fi
          done

      - name: Enable CONFIG_KPROBES in Base
        run: |
          cd ${{ env.KERNEL_DIR }}
          if grep -q "# CONFIG_KPROBES is not set" arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}; then
            sed -i 's/# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/' \
              arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}
          elif ! grep -q "^CONFIG_KPROBES=y" arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}; then
            echo "CONFIG_KPROBES=y" >> arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}
          fi

      - name: Cache AOSP Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: toolchain/clang
          key: aosp-clang-${{ env.CLANG_VERSION }}

      - name: Download AOSP Clang (cache miss only)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain/clang
          wget -q \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-${{ env.CLANG_VERSION }}.tar.gz" \
            -O toolchain/clang.tar.gz
          tar -xzf toolchain/clang.tar.gz -C toolchain/clang
          rm toolchain/clang.tar.gz

      - name: Cache Patched Kernel Source for Matrix
        uses: actions/cache/save@v4
        with:
          path: ${{ env.KERNEL_DIR }}
          key: kernel-patched-${{ github.run_id }}

  # ── Job 2: Matrix build ─────────────────────────────────────────────────────
  build:
    name: "[${{ matrix.variant }}] sweet"
    needs: setup
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        variant: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Restore Patched Kernel Source
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.KERNEL_DIR }}
          key: kernel-patched-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Restore AOSP Clang Toolchain
        uses: actions/cache/restore@v4
        with:
          path: toolchain/clang
          key: aosp-clang-${{ env.CLANG_VERSION }}
          fail-on-cache-miss: true

      - name: Install APT Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential bc bison ca-certificates curl flex \
            fontconfig-config fonts-dejavu-core gcc \
            gcc-aarch64-linux-gnu git gnupg gzip libelf-dev \
            lib32z1-dev libtinfo5 openssl pahole python3 repo \
            rsync schedtool wget zip zlib1g-dev

      - name: Verify Clang
        run: |
          echo "Clang: $(toolchain/clang/bin/clang --version | head -1)"



      - name: Integrate KernelSU Next (Inline Hook)
        if: matrix.variant == 'kernelsu_next'
        run: |
          cd ${{ env.KERNEL_DIR }}
          echo "── KernelSU Next: integration ──"

          git clone --depth=1 "${{ env.KERNELSU_NEXT_REPO }}" ../ksu_src
          cp -r ../ksu_src/kernel drivers/kernelsu
          echo "  ✓ driver files → drivers/kernelsu"

          grep -q "kernelsu" drivers/Makefile || \
            printf '\n# KernelSU Next\nobj-y += kernelsu/\n' >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || \
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # Fix uapi directory BEFORE configuration
          echo "Setting up uapi headers..."
          if [ -d "../ksu_src/kernel/uapi" ]; then
            mkdir -p drivers/kernelsu/uapi
            cp -r ../ksu_src/kernel/uapi/* drivers/kernelsu/uapi/ 2>/dev/null || true
            echo "  ✓ uapi copied from source"
          fi
          
          # Handle app_profile.h specifically
          if [ ! -f "drivers/kernelsu/uapi/app_profile.h" ]; then
            if [ -f "../ksu_src/kernel/uapi/app_profile.h" ]; then
              cp ../ksu_src/kernel/uapi/app_profile.h drivers/kernelsu/uapi/
            elif find ../ksu_src -name "app_profile.h" 2>/dev/null | grep -q .; then
              cp $(find ../ksu_src -name "app_profile.h" 2>/dev/null | head -1) drivers/kernelsu/uapi/
            else
              mkdir -p drivers/kernelsu/uapi
              touch drivers/kernelsu/uapi/app_profile.h
            fi
          fi
          
          # Create symlink for policy includes
          rm -rf drivers/kernelsu/policy/uapi 2>/dev/null || true
          mkdir -p drivers/kernelsu/uapi
          ln -sf ../uapi drivers/kernelsu/policy/uapi
          echo "  ✓ uapi symlink created"

          # Use inline hook mode exclusively
          echo "ccflags-y += -DKSU_GIT_VERSION=\"\\\"ac539bd\\\"\"" >> drivers/kernelsu/Kbuild
          
          printf '%s\n' \
            '' \
            '# KernelSU Next — inline hook' \
            'CONFIG_KSU=y' \
            'CONFIG_KSU_INLINE_HOOK=y' \
            >> arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}
          echo "  ✓ Using inline hook mode"

          grep -q "CONFIG_KSU_KPROBES_HOOK" drivers/kernelsu/Kconfig 2>/dev/null && \
            echo 'CONFIG_KSU_KPROBES_HOOK=n' >> arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }} || true

          echo "  ✓ KernelSU Next integration complete"

      - name: Verify KernelSU uAPI Integration
        if: matrix.variant == 'kernelsu_next'
        run: |
          cd ${{ env.KERNEL_DIR }}
          echo "Verifying KernelSU-Next integration..."
          echo "  Checking uapi structure:"
          [ -d "drivers/kernelsu/uapi" ] && echo "    ✓ drivers/kernelsu/uapi exists" || echo "    ✗ drivers/kernelsu/uapi missing"
          [ -L "drivers/kernelsu/policy/uapi" ] && echo "    ✓ drivers/kernelsu/policy/uapi is symlink" || echo "    ✗ drivers/kernelsu/policy/uapi not symlink"
          
          if [ -f "drivers/kernelsu/uapi/app_profile.h" ]; then
            echo "    ✓ app_profile.h found at drivers/kernelsu/uapi/app_profile.h"
          else
            echo "    ✗ app_profile.h not found"
            echo "    Available uapi files:"
            find drivers/kernelsu -name "*.h" -path "*/uapi/*" 2>/dev/null | head -10
          fi

      - name: Verify KowSU uAPI Integration
        if: matrix.variant == 'kowsu'
        run: |
          cd ${{ env.KERNEL_DIR }}
          echo "Verifying KowSU integration..."
          echo "  Checking uapi structure:"
          [ -d "drivers/kernelsu/uapi" ] && echo "    ✓ drivers/kernelsu/uapi exists" || echo "    ✗ drivers/kernelsu/uapi missing"
          [ -L "drivers/kernelsu/policy/uapi" ] && echo "    ✓ drivers/kernelsu/policy/uapi is symlink" || echo "    ✗ drivers/kernelsu/policy/uapi not symlink"
          
          if [ -f "drivers/kernelsu/uapi/app_profile.h" ]; then
            echo "    ✓ app_profile.h found at drivers/kernelsu/uapi/app_profile.h"
          else
            echo "    ✗ app_profile.h not found"
            echo "    Available uapi files:"
            find drivers/kernelsu -name "*.h" -path "*/uapi/*" 2>/dev/null | head -10
          fi

      - name: Integrate KowSU (Inline Hook)
        if: matrix.variant == 'kowsu'
        run: |
          cd ${{ env.KERNEL_DIR }}
          echo "── KowSU: integration ──"

          git clone --depth=1 "${{ env.KOWSU_REPO }}" ../ksu_src
          cp -r ../ksu_src/kernel drivers/kernelsu
          echo "  ✓ driver files → drivers/kernelsu"

          grep -q "kernelsu" drivers/Makefile || \
            printf '\n# KowSU\nobj-y += kernelsu/\n' >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || \
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # Fix uapi directory BEFORE configuration
          echo "Setting up uapi headers..."
          if [ -d "../ksu_src/kernel/uapi" ]; then
            mkdir -p drivers/kernelsu/uapi
            cp -r ../ksu_src/kernel/uapi/* drivers/kernelsu/uapi/ 2>/dev/null || true
            echo "  ✓ uapi copied from source"
          fi
          
          # Handle app_profile.h specifically
          if [ ! -f "drivers/kernelsu/uapi/app_profile.h" ]; then
            if [ -f "../ksu_src/kernel/uapi/app_profile.h" ]; then
              cp ../ksu_src/kernel/uapi/app_profile.h drivers/kernelsu/uapi/
            elif find ../ksu_src -name "app_profile.h" 2>/dev/null | grep -q .; then
              cp $(find ../ksu_src -name "app_profile.h" 2>/dev/null | head -1) drivers/kernelsu/uapi/
            else
              mkdir -p drivers/kernelsu/uapi
              touch drivers/kernelsu/uapi/app_profile.h
            fi
          fi
          
          # Create symlink for policy includes
          rm -rf drivers/kernelsu/policy/uapi 2>/dev/null || true
          mkdir -p drivers/kernelsu/uapi
          ln -sf ../uapi drivers/kernelsu/policy/uapi
          echo "  ✓ uapi symlink created"

          # Use inline hook mode exclusively
          echo "ccflags-y += -DKSU_GIT_VERSION=\"\\\"ac539bd\\\"\"" >> drivers/kernelsu/Kbuild
          
          printf '%s\n' \
            '' \
            '# KowSU — inline hook' \
            'CONFIG_KSU=y' \
            'CONFIG_KSU_INLINE_HOOK=y' \
            >> arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}
          echo "  ✓ Using inline hook mode"

          grep -q "CONFIG_KSU_KPROBES_HOOK" drivers/kernelsu/Kconfig 2>/dev/null && \
            echo 'CONFIG_KSU_KPROBES_HOOK=n' >> arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }} || true

          echo "  ✓ KowSU integration complete"

      - name: Apply SUSFS Patches
        if: ${{ github.event.inputs.susfs_enabled == 'true' && matrix.variant != 'vanilla' }}
        run: |
          cd ${{ env.KERNEL_DIR }}
          SUSFS_URL="https://github.com/JackA1ltMan/susfs4ksu/raw/main/ksu_next.patch"
          if curl -Lsf "$SUSFS_URL" | patch -p1 --dry-run > /dev/null 2>&1; then
            curl -Lsf "$SUSFS_URL" | patch -s -p1 --fuzz=5 || echo "  ⚠ SUSFS patch failed"
            echo "  ✓ SUSFS applied"
          else
            echo "  ⚠ SUSFS patch does not apply cleanly, skipping"
          fi

      - name: Configure AVC Spoofing & SELinux Hiding
        if: ${{ github.event.inputs.avc_spoof == 'true' || github.event.inputs.hide_selinux == 'true' }}
        run: |
          cd ${{ env.KERNEL_DIR }}
          if [ "${{ github.event.inputs.avc_spoof }}" = "true" ]; then
            printf '%s\n' '' '# AVC Log Spoofing' \
              'CONFIG_AUDIT=y' 'CONFIG_AUDIT_ARCH=y' \
              'CONFIG_AUDITSYSCALL=y' 'CONFIG_AUDIT_GENERIC=y' \
              >> arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}
          fi
          if [ "${{ github.event.inputs.hide_selinux }}" = "true" ]; then
            printf '%s\n' '' '# SELinux Hiding' \
              'CONFIG_SECURITY_SELINUX=y' \
              'CONFIG_SECURITY_SELINUX_BOOTPARAM=y' \
              'CONFIG_SECURITY_SELINUX_DEVELOP=y' \
              'CONFIG_SECURITY_SELINUX_DEBUG=y' \
              'CONFIG_SECURITY_SELINUX_AVC_STATS=y' \
              >> arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}
          fi

      - name: Deduplicate Defconfig
        run: |
          cd ${{ env.KERNEL_DIR }}
          awk '!seen[$0]++' arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }} \
            > arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}.tmp
          mv arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}.tmp \
             arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}
          echo "Defconfig tail:"
          tail -20 arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}

      - name: Build Kernel
        run: |
          cd ${{ env.KERNEL_DIR }}
          export PATH=${{ github.workspace }}/toolchain/clang/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang CXX=clang++ LD=ld.lld
          export AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

          make O=out ARCH=${{ env.ARCH }} ${{ env.DEVICE_DEFCONFIG }}

          make -j$(nproc) O=out ARCH=${{ env.ARCH }} \
            LLVM=1 LTO=thin \
            LOCALVERSION="-${{ matrix.variant }}-${{ env.DEVICE }}" \
            Image.gz dtbs

          echo "Build complete!"
          ls -lh out/arch/arm64/boot/

      - name: Set Build Date
        id: date
        run: echo "value=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Set Release Timestamp
        id: timestamp
        run: echo "value=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

      - name: Set Build Time
        id: time
        run: echo "value=$(date +%H%M)" >> $GITHUB_OUTPUT

      - name: Prepare Flashable ZIP
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AK3
          cd AK3

          cp ../${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz zImage
          find ../${{ env.KERNEL_DIR }}/out/arch/arm64/boot/dts \
            -name "*.dtb" -exec cat {} + > dtb

          # Configure AnyKernel3 for sweet device
          echo "Configuring AnyKernel3 for sweet..."
          
          # Device configuration
          sed -i 's/device.name1=.*/device.name1=sweet/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=sweetin/' anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=0/' anykernel.sh
          
          # Let AnyKernel3 auto-detect the block device (safer for single boot partition)
          # Remove any hardcoded block device to allow automatic detection
          sed -i '/^block=/d' anykernel.sh || true
          
          # Map variant to friendly name
          V_NAME="${{ matrix.variant }}"
          case "$V_NAME" in
            "kernelsu_next") F_NAME="KernelSU Next" ;;
            "kowsu") F_NAME="KowSU" ;;
            "vanilla") F_NAME="No KSU" ;;
            *) F_NAME="$V_NAME" ;;
          esac
          
          # Set kernel string with build information
          sed -i "s/kernel.string=.*/kernel.string=Vantom Kernel - $F_NAME - Build ${{ steps.date.outputs.value }}/" anykernel.sh

          # Map variant and SUSFS for filename
          V_FILE="${{ matrix.variant }}"
          [ "$V_FILE" = "kernelsu_next" ] && V_FILE="ksunext"
          
          # Logic fix: Only add -susfs if enabled AND NOT vanilla
          if [ "${{ github.event.inputs.susfs_enabled }}" = "true" ] && [ "${{ matrix.variant }}" != "vanilla" ]; then
            S_FILE="-susfs"
          else
            S_FILE=""
          fi
          
          ZIPNAME="${V_FILE}${S_FILE}-VantomKernel-sweet-${{ steps.date.outputs.value }}-${{ steps.time.outputs.value }}"

          cat > metadata.txt << EOF
          VARIANT=${{ matrix.variant }}
          SUSFS=${{ github.event.inputs.susfs_enabled }}
          AVC_SPOOF=${{ github.event.inputs.avc_spoof }}
          HIDE_SELINUX=${{ github.event.inputs.hide_selinux }}
          DEVICE=sweet
          BUILD_DATE=${{ steps.timestamp.outputs.value }}
          EOF

          cat > BUILD_INFO.txt << EOF
          ╔════════════════════════════════════════════════════════════╗
          ║           Vantom Kernel Build Information                  ║
          ╚════════════════════════════════════════════════════════════╝

          Build Details:
          ──────────────────────────────────────────────────────────────
          Date & Time:    ${{ steps.timestamp.outputs.value }}
          Date (YYYYMMDD): ${{ steps.date.outputs.value }}
          Variant:        ${{ matrix.variant }}
          Device:         sweet (Redmi Note 10 Pro)

          Features:
          ──────────────────────────────────────────────────────────────
          Root Manager:   ${{ matrix.variant }}
          SUSFS Enabled:  ${{ github.event.inputs.susfs_enabled }}
          AVC Spoofing:   ${{ github.event.inputs.avc_spoof }}
          SELinux Hiding: ${{ github.event.inputs.hide_selinux }}

          Build Configuration:
          ──────────────────────────────────────────────────────────────
          Kernel:         4.14.x (arm64)
          Compiler:       AOSP Clang ${{ env.CLANG_VERSION }}
          Optimization:   LTO thin · LLVM · -O3
          Architecture:   ARM64
          Defconfig:      ${{ env.DEVICE_DEFCONFIG }}

          File Information:
          ──────────────────────────────────────────────────────────────
          Kernel Image:   Image.gz
          Device Tree:    dtb (concatenated)
          Filename:       $ZIPNAME

          Release Notes:
          ──────────────────────────────────────────────────────────────
          GitHub Release: ${{ env.ZIP_NAME }}-${{ steps.date.outputs.value }}
          Build ID:       ${{ github.run_id }}
          Run Number:     ${{ github.run_number }}
          Repository:     ${{ github.repository }}

          Installation:
          ──────────────────────────────────────────────────────────────
          1. Download the ZIP file
          2. Boot into recovery (TWRP)
          3. Install → Select $ZIPNAME.zip
          4. Reboot and enjoy!

          ════════════════════════════════════════════════════════════════
          EOF

          # Create clean flashable zip (exclude unnecessary files)
          cd ..
          zip -r9 ${ZIPNAME}.zip AK3/* -x "AK3/.git/*" "AK3/.gitignore" "AK3/*.md" "AK3/LICENSE"
          echo "ZIP_NAME=${ZIPNAME}" >> $GITHUB_ENV
          ls -lh ${ZIPNAME}.zip

      - name: Generate Release Notes
        run: |
          cat > /tmp/release_body.md << 'RELEOF'
          # Kernel [${{ matrix.variant }}] for ${{ env.DEVICE }} (Redmi Note 10 Pro)

          | Feature | Status |
          |---------|--------|
          | Root Manager | `${{ matrix.variant }}` |
          RELEOF

          if [ "${{ matrix.variant }}" != "vanilla" ]; then
            cat >> /tmp/release_body.md << 'RELEOF'
          | Hook Method | Manual (no kprobes) |
          | SUSFS | ${{ github.event.inputs.susfs_enabled == 'true' && '✅' || '❌' }} |
          | AVC Log Spoofing | ${{ github.event.inputs.avc_spoof == 'true' && '✅' || '❌' }} |
          | SELinux Hiding | ${{ github.event.inputs.hide_selinux == 'true' && '✅' || '❌' }} |
          RELEOF
          fi

          cat >> /tmp/release_body.md << 'RELEOF'

          **Build:** 4.14.x · arm64 · AOSP Clang ${{ env.CLANG_VERSION }} · LTO thin · LLVM
          **Date:** ${{ steps.timestamp.outputs.value }}
          RELEOF

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
          retention-days: 30

      - name: Create Release
        if: ${{ github.event.inputs.release == 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ZIP_NAME }}.zip
          tag_name: ${{ env.ZIP_NAME }}-${{ steps.date.outputs.value }}
          body_path: /tmp/release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: always()
        run: |
          echo "## 🔨 [${{ matrix.variant }}] Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Variant | ${{ matrix.variant }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SUSFS | ${{ github.event.inputs.susfs_enabled }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AVC Spoofing | ${{ github.event.inputs.avc_spoof }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SELinux Hiding | ${{ github.event.inputs.hide_selinux }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Compiler | AOSP Clang ${{ env.CLANG_VERSION }} |" >> $GITHUB_STEP_SUMMARY