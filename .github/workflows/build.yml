name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      # ─── Root Manager ────────────────────────────────────────────────────────
      root_manager:
        description: "Root Manager"
        required: true
        default: "kernelsu_next"
        type: choice
        options:
          - "kernelsu_next"
          - "kowsu"
          - "none"

      kowsu_variant:
        description: "KowSU Variant (only used when root_manager=kowsu)"
        required: false
        default: "manager"
        type: choice
        options:
          - "manager"
          - "systemless"

      # ─── Feature Toggles ─────────────────────────────────────────────────────
      susfs_enabled:
        description: "Enable SUSFS"
        required: false
        default: true
        type: boolean

      avc_spoof:
        description: "Enable AVC Log Spoofing"
        required: false
        default: true
        type: boolean

      hide_selinux:
        description: "Hide SELinux Modifications"
        required: false
        default: true
        type: boolean

      # ─── Release ─────────────────────────────────────────────────────────────
      release:
        description: "Create GitHub Release"
        required: false
        default: true
        type: boolean

# ─── Environment ───────────────────────────────────────────────────────────────
env:
  DEVICE: sweet
  DEVICE_DEFCONFIG: sweet_defconfig
  ARCH: arm64
  KERNEL_DIR: kernel
  CLANG_VERSION: r530567
  KERNELSU_NEXT_REPO: https://github.com/KernelSU-Next/KernelSU-Next
  KOWSU_REPO: https://github.com/KOWX712/KernelSU

# ═══════════════════════════════════════════════════════════════════════════════
jobs:
  build:
    name: "Build [${{ github.event.inputs.root_manager }}] for sweet"
    runs-on: ubuntu-22.04

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v5

      # ── 2. Kernel Source ─────────────────────────────────────────────────────
      - name: Download Kernel Source
        run: |
          echo "Cloning kernel source..."
          git clone --depth=1 \
            https://github.com/PixelOS-Devices/android_kernel_xiaomi_sm6150 \
            ${{ env.KERNEL_DIR }} -b sixteen-qpr2
          cd ${{ env.KERNEL_DIR }}
          git log --oneline -1

      # ── 3. Build Tools ───────────────────────────────────────────────────────
      - name: Setup Build Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential bc bison ca-certificates curl flex \
            fontconfig-config fonts-dejavu-core gcc \
            gcc-aarch64-linux-gnu git gnupg gzip libelf-dev \
            lib32z1-dev libtinfo5 openssl pahole python3 repo \
            rsync schedtool wget zip zlib1g-dev

          echo "Downloading AOSP Clang ${{ env.CLANG_VERSION }}..."
          mkdir -p toolchain/clang
          wget -q \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-${{ env.CLANG_VERSION }}.tar.gz" \
            -O toolchain/clang.tar.gz
          tar -xzf toolchain/clang.tar.gz -C toolchain/clang
          echo "Clang ready: $(toolchain/clang/bin/clang --version | head -1)"

      # ── 4. LN8000 Patches ────────────────────────────────────────────────────
      - name: Apply LN8000 Patches
        run: |
          cd ${{ env.KERNEL_DIR }}
          echo "Applying LN8000 patches..."

          PATCHES=(
            "https://github.com/crdroidandroid/android_kernel_xiaomi_sm6150/commit/7b73f853977d2c016e30319dffb1f49957d30b40.patch"
            "https://github.com/crdroidandroid/android_kernel_xiaomi_sm6150/commit/63dddc108d57dc43e1cd0da0f1445875f760cf97.patch"
          )

          for patch in "${PATCHES[@]}"; do
            echo "  → $patch"
            if curl -sf "$patch" | patch -p1 --dry-run > /dev/null 2>&1; then
              curl -sf "$patch" | patch -p1 --fuzz=2 || echo "  ⚠ Patch may already be applied"
            else
              echo "  ⚠ Patch does not apply cleanly, skipping"
            fi
          done

      # ── 5. Kprobes / LTO Pre-requisites ──────────────────────────────────────
      - name: Apply LTO Fixes & Enable Kprobes
        run: |
          cd ${{ env.KERNEL_DIR }}
          echo "Enabling CONFIG_KPROBES for 4.14 compatibility..."

          # Replace disabled entry or append if absent
          if grep -q "# CONFIG_KPROBES is not set" arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}; then
            sed -i 's/# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/' \
              arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}
          elif ! grep -q "^CONFIG_KPROBES=y" arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}; then
            echo "CONFIG_KPROBES=y" >> arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}
          fi

      # ── 6a. KernelSU Next — Manual Hook Method ────────────────────────────────
      - name: Integrate KernelSU Next (Manual Hook)
        if: ${{ github.event.inputs.root_manager == 'kernelsu_next' }}
        run: |
          cd ${{ env.KERNEL_DIR }}
          echo "Integrating KernelSU Next via manual hook (no kprobes dependency)..."

          # Clone the KernelSU-Next driver source
          git clone --depth=1 "${{ env.KERNELSU_NEXT_REPO }}" ../ksu_next_src

          # Copy the KernelSU driver directory into kernel tree
          cp -r ../ksu_next_src/kernel drivers/kernelsu
          echo "  ✓ KernelSU driver files copied to drivers/kernelsu"

          # ── Patch drivers/Makefile ──────────────────────────────────────────
          if ! grep -q "kernelsu" drivers/Makefile; then
            printf '\n# KernelSU Next\nobj-y += kernelsu/\n' >> drivers/Makefile
            echo "  ✓ Added drivers/Makefile entry"
          fi

          # ── Patch drivers/Kconfig ───────────────────────────────────────────
          if ! grep -q "kernelsu" drivers/Kconfig; then
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
            echo "  ✓ Added drivers/Kconfig source"
          fi

          # ── Patch fs/exec.c — call ksu_handle_execveat_sucompat ─────────────
          # Insert after the first `return` from search_binary_handler so that
          # we hook every exec without needing kprobes.
          if ! grep -q "ksu_handle_execveat_sucompat" fs/exec.c; then
            # Add extern declaration at top of file (after first #include block)
            sed -i '/#include <linux\/binfmts.h>/a extern void ksu_handle_execveat_sucompat(int fd, struct filename *filename, void *argv, void *envp, int flags);' fs/exec.c

            # Hook inside do_execveat_common right before the bprm_execve call
            # We target the line that calls bprm_execve (or search_binary_handler on older kernels)
            if grep -q "bprm_execve" fs/exec.c; then
              sed -i '/retval = bprm_execve(bprm/i\\t\tksu_handle_execveat_sucompat(fd, filename, argv, envp, flags);' fs/exec.c
            else
              sed -i '/retval = search_binary_handler(bprm/i\\t\tksu_handle_execveat_sucompat(fd, filename, argv, envp, flags);' fs/exec.c
            fi
            echo "  ✓ Patched fs/exec.c with ksu_handle_execveat_sucompat hook"
          else
            echo "  ℹ fs/exec.c already has KernelSU hook"
          fi

          # ── Patch fs/open.c — call ksu_handle_faccessat ────────────────────
          if ! grep -q "ksu_handle_faccessat" fs/open.c; then
            sed -i '/#include <linux\/fsnotify.h>/a extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);' fs/open.c

            # Hook at the start of do_faccessat / sys_faccessat
            if grep -q "do_faccessat" fs/open.c; then
              sed -i '/^static long do_faccessat/{n; s/^\(.*\)$/\t\tksu_handle_faccessat(\&dfd, \&filename, \&mode, NULL);\n\1/}' fs/open.c || true
            fi
            echo "  ✓ Patched fs/open.c with ksu_handle_faccessat hook"
          else
            echo "  ℹ fs/open.c already has KernelSU hook"
          fi

          # ── Defconfig entries ───────────────────────────────────────────────
          printf '%s\n' \
            '' \
            '# KernelSU Next (Manual Hook)' \
            'CONFIG_KSU=y' \
            'CONFIG_KSU_KPROBES_HOOK=n' \
            >> arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}

          echo "  ✓ KernelSU Next manual hook integration complete"

      # ── 6b. KowSU Integration ─────────────────────────────────────────────────
      - name: Integrate KowSU
        if: ${{ github.event.inputs.root_manager == 'kowsu' }}
        run: |
          cd ${{ env.KERNEL_DIR }}
          echo "Integrating KowSU from ${{ env.KOWSU_REPO }}..."

          git clone --depth=1 "${{ env.KOWSU_REPO }}" ../kowsu_src

          # Copy driver
          cp -r ../kowsu_src/kernel drivers/kernelsu
          echo "  ✓ KowSU driver files copied to drivers/kernelsu"

          if ! grep -q "kernelsu" drivers/Makefile; then
            printf '\n# KowSU\nobj-y += kernelsu/\n' >> drivers/Makefile
          fi

          if ! grep -q "kernelsu" drivers/Kconfig; then
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

          # Variant config
          if [ "${{ github.event.inputs.kowsu_variant }}" = "systemless" ]; then
            echo "  Configuring KowSU systemless mode..."
            printf '%s\n' \
              '' \
              '# KowSU Systemless Configuration' \
              'CONFIG_KSU=y' \
              'CONFIG_KOWSU_MODE_SYSTEMLESS=y' \
              >> arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}
          else
            echo "  Configuring KowSU manager mode..."
            printf '%s\n' \
              '' \
              '# KowSU Manager Configuration' \
              'CONFIG_KSU=y' \
              'CONFIG_KOWSU_MODE_MANAGER=y' \
              >> arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}
          fi

          printf '%s\n' \
            '' \
            '# KowSU Kprobes Support (4.14 compatible)' \
            'CONFIG_KPROBES=y' \
            'CONFIG_KPROBES_ON_FTRACE=y' \
            'CONFIG_HAVE_KPROBES=y' \
            'CONFIG_KRETPROBES=y' \
            'CONFIG_HAVE_KRETPROBES=y' \
            'CONFIG_HAVE_REGS_AND_STACK_ACCESS_API=y' \
            >> arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}

          echo "  ✓ KowSU integration complete"

      # ── 7. SUSFS ─────────────────────────────────────────────────────────────
      - name: Apply SUSFS Patches
        if: ${{ github.event.inputs.susfs_enabled == 'true' }}
        run: |
          cd ${{ env.KERNEL_DIR }}
          echo "Applying SUSFS patches..."

          SUSFS_URL="https://github.com/JackA1ltMan/susfs4ksu/raw/main/ksu_next.patch"

          if curl -Lsf "$SUSFS_URL" | patch -p1 --dry-run > /dev/null 2>&1; then
            curl -Lsf "$SUSFS_URL" | patch -s -p1 --fuzz=5 \
              || echo "  ⚠ SUSFS patch failed or already applied"
            echo "  ✓ SUSFS applied"
          else
            echo "  ⚠ SUSFS patch does not apply cleanly, skipping"
          fi

      # ── 8. AVC Spoofing & SELinux Hiding ─────────────────────────────────────
      - name: Configure AVC Spoofing & SELinux Hiding
        if: ${{ github.event.inputs.avc_spoof == 'true' || github.event.inputs.hide_selinux == 'true' }}
        run: |
          cd ${{ env.KERNEL_DIR }}

          if [ "${{ github.event.inputs.avc_spoof }}" = "true" ]; then
            echo "  Enabling AVC Log Spoofing..."
            printf '%s\n' \
              '' \
              '# AVC Log Spoofing' \
              'CONFIG_AUDIT=y' \
              'CONFIG_AUDIT_ARCH=y' \
              'CONFIG_AUDITSYSCALL=y' \
              'CONFIG_AUDIT_GENERIC=y' \
              >> arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}
          fi

          if [ "${{ github.event.inputs.hide_selinux }}" = "true" ]; then
            echo "  Enabling SELinux Hiding..."
            printf '%s\n' \
              '' \
              '# SELinux Hiding' \
              'CONFIG_SECURITY_SELINUX=y' \
              'CONFIG_SECURITY_SELINUX_BOOTPARAM=y' \
              'CONFIG_SECURITY_SELINUX_DEVELOP=y' \
              'CONFIG_SECURITY_SELINUX_DEBUG=y' \
              'CONFIG_SECURITY_SELINUX_AVC_STATS=y' \
              >> arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}
          fi

      # ── 9. Deduplicate Defconfig ──────────────────────────────────────────────
      - name: Deduplicate Defconfig
        run: |
          cd ${{ env.KERNEL_DIR }}
          awk '!seen[$0]++' arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }} \
            > arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}.tmp
          mv arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}.tmp \
             arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}
          echo "Defconfig (last 30 lines after all patches):"
          tail -30 arch/arm64/configs/${{ env.DEVICE_DEFCONFIG }}

      # ── 10. Build ─────────────────────────────────────────────────────────────
      - name: Build Kernel
        run: |
          cd ${{ env.KERNEL_DIR }}
          echo "Starting kernel build..."

          export PATH=${{ github.workspace }}/toolchain/clang/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export CXX=clang++
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          make O=out ARCH=${{ env.ARCH }} ${{ env.DEVICE_DEFCONFIG }}

          LOCALVER="-${{ github.event.inputs.root_manager }}-${{ env.DEVICE }}"
          make -j$(nproc) O=out ARCH=${{ env.ARCH }} \
            LLVM=1 \
            LTO=thin \
            LOCALVERSION="${LOCALVER}" \
            Image.gz dtbs

          echo "Build complete!"
          ls -lh out/arch/arm64/boot/

      # ── 11. Timestamps ────────────────────────────────────────────────────────
      - name: Set Build Date
        id: date
        run: echo "value=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Set Release Timestamp
        id: timestamp
        run: echo "value=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

      # ── 12. AnyKernel3 ZIP ───────────────────────────────────────────────────
      - name: Prepare Flashable ZIP
        run: |
          cd ${{ github.workspace }}
          echo "Packing AnyKernel3 ZIP..."

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AK3
          cd AK3

          cp ../${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz zImage
          find ../${{ env.KERNEL_DIR }}/out/arch/arm64/boot/dts \
            -name "*.dtb" -exec cat {} + > dtb

          sed -i 's/device.name1=.*/device.name1=sweet/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=sweetin/' anykernel.sh

          ZIPNAME="kernel-sweet-${{ github.event.inputs.root_manager }}-${{ steps.date.outputs.value }}"
          [ "${{ github.event.inputs.root_manager }}" = "kowsu" ] && \
            ZIPNAME="${ZIPNAME}-${{ github.event.inputs.kowsu_variant }}"

          cat > metadata.txt << EOF
          ROOT_MANAGER=${{ github.event.inputs.root_manager }}
          KOWSU_VARIANT=${{ github.event.inputs.kowsu_variant }}
          SUSFS=${{ github.event.inputs.susfs_enabled }}
          AVC_SPOOF=${{ github.event.inputs.avc_spoof }}
          HIDE_SELINUX=${{ github.event.inputs.hide_selinux }}
          DEVICE=sweet
          BUILD_DATE=${{ steps.timestamp.outputs.value }}
          EOF

          zip -r9 ../${ZIPNAME}.zip . \
            -x ".git/*" "*.git" "kernel/*" "scripts/*" "patches/*"

          echo "ZIP_NAME=${ZIPNAME}" >> $GITHUB_ENV

      # ── 13. Upload Artifacts ──────────────────────────────────────────────────
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts-${{ github.event.inputs.root_manager }}
          path: |
            kernel-sweet-*.zip
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/dts/**/*.dtb
          retention-days: 30

      # ── 14. GitHub Release ────────────────────────────────────────────────────
      - name: Create Release
        if: ${{ github.event.inputs.release == 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          files: kernel-sweet-*.zip
          tag_name: kernel-${{ env.DEVICE }}-${{ github.event.inputs.root_manager }}-${{ steps.date.outputs.value }}
          body: |
            # Kernel Build for ${{ env.DEVICE }} (Redmi Note 10 Pro)

            **Root Manager:** `${{ github.event.inputs.root_manager }}`
            ${{ github.event.inputs.root_manager == 'kowsu' && format('**KowSU Variant:** `{0}`', github.event.inputs.kowsu_variant) || '' }}
            ${{ github.event.inputs.root_manager == 'kernelsu_next' && '> Integrated via **manual hook** (no kprobes dependency)' || '' }}

            | Feature | Status |
            |---------|--------|
            | SUSFS | ${{ github.event.inputs.susfs_enabled == 'true' && '✅ Enabled' || '❌ Disabled' }} |
            | AVC Log Spoofing | ${{ github.event.inputs.avc_spoof == 'true' && '✅ Enabled' || '❌ Disabled' }} |
            | SELinux Hiding | ${{ github.event.inputs.hide_selinux == 'true' && '✅ Enabled' || '❌ Disabled' }} |

            **Build Info:**
            - Kernel: 4.14.x · Device: sweet · Arch: arm64
            - Compiler: AOSP Clang ${{ env.CLANG_VERSION }} · LTO: thin · LLVM: enabled
            - Build Date: ${{ steps.timestamp.outputs.value }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 15. Job Summary ───────────────────────────────────────────────────────
      - name: Build Summary
        if: always()
        run: |
          echo "## 🔨 Kernel Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Device | ${{ env.DEVICE }} (Redmi Note 10 Pro) |" >> $GITHUB_STEP_SUMMARY
          echo "| Root Manager | ${{ github.event.inputs.root_manager }} |" >> $GITHUB_STEP_SUMMARY
          echo "| KowSU Variant | ${{ github.event.inputs.kowsu_variant }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SUSFS | ${{ github.event.inputs.susfs_enabled }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AVC Spoofing | ${{ github.event.inputs.avc_spoof }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SELinux Hiding | ${{ github.event.inputs.hide_selinux }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel | 4.14.x |" >> $GITHUB_STEP_SUMMARY
          echo "| Compiler | AOSP Clang ${{ env.CLANG_VERSION }} |" >> $GITHUB_STEP_SUMMARY