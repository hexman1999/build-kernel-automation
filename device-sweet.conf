# Device Configuration for Sweet (Redmi Note 10 Pro)
# This file contains device-specific build configuration

# Device Information
DEVICE_NAME="sweet"
DEVICE_FULL_NAME="Redmi Note 10 Pro"
DEVICE_CODENAME="sweet"
DEVICE_CODENAME_ALT="sweetin"
SOC="SM6150"
ANDROID_VERSION="11-16"

# Kernel Configuration
KERNEL_DEFCONFIG="sweet_defconfig"
DEVICE_DEFCONFIG_PATH="arch/arm64/configs/sweet_defconfig"
DTB_NAME="dtb.img"
DTB_PATH="arch/arm64/boot/dtb.img"
KERNEL_IMAGE="Image.gz"
KERNEL_IMAGE_PATH="arch/arm64/boot/Image.gz"

# Build Configuration
ARCH="arm64"
CROSS_COMPILE="aarch64-linux-gnu-"
CLANG_TRIPLE="aarch64-linux-gnu-"

# Compiler Configuration
CLANG_VERSION="r530567"
GCC_VERSION="11"
LLVM_VERSION="14"

# Build Optimization Flags
BUILD_OPTIMIZATION_FLAGS="-O3"
ENABLE_LTO="true"
LTO_TYPE="thin"
USE_LLVM="true"

# Kernel Modules
BUILD_MODULES="false"
BUILD_DTBO="true"

# Boot Configuration
BOOT_IMAGE_FLASH_OFFSET="0x00008000"
CMDLINE="console=ttyMSM0,115200n8"

# Device Features
SUPPORTS_FASTBOOT="true"
FASTBOOT_TIMEOUT="300"

# AnyKernel3 Configuration
ANYKERNEL3_DEVICE_NAME1="sweet"
ANYKERNEL3_DEVICE_NAME2="sweetin"
ANYKERNEL3_SUPPORTED_VERSIONS="11;12;13;14;15;16"

# Output Configuration
OUTPUT_DIR="out"
FLASHABLE_ZIP_NAME="kernel-sweet-KSU-{KSU_VERSION}-{BUILD_DATE}.zip"
KERNEL_ARCHIVE_NAME="kernel-sweet-{BUILD_DATE}.tar.gz"

# Feature Configuration (Can be overridden by workflow inputs)
ENABLE_KERNELSU="true"
KERNELSU_VERSION="next"
ENABLE_SUSFS="true"
ENABLE_KOWSU="true"
ENABLE_AVC_SPOOF="true"
ENABLE_HIDE_SELINUX="true"

# Security Configuration
ENABLE_SELINUX="true"
ENABLE_KPROBES="true"
ENABLE_AUDIT="true"

# Patch Configuration
ENABLE_LN8000_PATCHES="true"
ENABLE_DTBO_PATCHES="true"
ENABLE_KPATCH_FIXES="true"

# Repository Configuration
KERNEL_SOURCE_REPO="https://github.com/PixelOS-Devices/android_kernel_xiaomi_sm6150"
KERNEL_SOURCE_BRANCH="sixteen-qpr2"
KERNEL_SOURCE_DEPTH="1"

# Toolchain URLs
AOSP_CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-16.0.0_r16.tar.gz/clang/{CLANG_VERSION}.tar.gz"
AOSP_GCC_URL="https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-gnu-{GCC_VERSION}.tar.gz"
